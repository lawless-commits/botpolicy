name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run pack
      - name: Run the packed tarball with npx
        run: |
          tarball="$PWD/$(ls botpolicy-*.tgz)"
          expected="$(node -p "require('./package.json').version")"
          cd "$RUNNER_TEMP"
          actual="$(npx --yes --package "$tarball" botpolicy --version)"
          echo "expected $expected, got $actual"
          test "$actual" = "$expected"
